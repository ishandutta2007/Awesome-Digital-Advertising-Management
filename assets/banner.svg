<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrbAlt {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.25) translate(-30px, 20px); opacity: 0.55; }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes barRise {
      0%, 100% { transform: scaleY(0.7); }
      50% { transform: scaleY(1.05); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .orb-1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 950px 100px; }
    .orb-2 { animation: pulseOrbAlt 11s ease-in-out infinite; transform-origin: 150px 300px; }
    .flow-stream { stroke-dasharray: 12 18; animation: waveFlow 14s linear infinite; }
    .bar-anim-1 { animation: barRise 4s ease-in-out infinite; transform-origin: bottom; }
    .bar-anim-2 { animation: barRise 5.2s ease-in-out infinite 0.8s; transform-origin: bottom; }
    .bar-anim-3 { animation: barRise 4.6s ease-in-out infinite 1.5s; transform-origin: bottom; }
    .floating-badge { animation: floatCard 6s ease-in-out infinite; }
    .floating-badge-alt { animation: floatCard 7s ease-in-out infinite 1.2s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Dynamic / Animated Ambient Background Orbs -->
  <g class="orb-1">
    <circle cx="980" cy="120" r="180" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
    <circle cx="1060" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
  </g>
  <g class="orb-2">
    <circle cx="140" cy="320" r="170" fill="#c084fc" filter="url(#glow)" opacity="0.2" />
    <circle cx="220" cy="350" r="130" fill="#3b82f6" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Dynamic AdTech Data Stream & Network Waves (Background) -->
  <path d="M -50 210 Q 250 120 550 220 T 1250 190" fill="none" stroke="url(#flowGrad)" stroke-width="3" class="flow-stream" />
  <path d="M -50 280 Q 350 370 700 260 T 1250 300" fill="none" stroke="url(#flowGrad)" stroke-width="2" class="flow-stream" style="animation-duration: 20s;" />

  <!-- Animated Chart Graphic (Right side / background accent) -->
  <g transform="translate(870, 190)">
    <!-- Chart Base Frame -->
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">CTR &amp; ROAS OPTIMIZATION</text>
    
    <!-- Mini Metric Sparkline -->
    <path d="M 20 115 Q 60 70, 100 95 T 160 55 T 235 40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)" />
    
    <!-- Animated Yield Bars -->
    <g transform="translate(40, 130)">
      <rect x="0" y="-35" width="14" height="35" rx="3" fill="#6366f1" class="bar-anim-1" />
      <rect x="25" y="-55" width="14" height="55" rx="3" fill="#818cf8" class="bar-anim-2" />
      <rect x="50" y="-45" width="14" height="45" rx="3" fill="#38bdf8" class="bar-anim-3" />
      <rect x="75" y="-75" width="14" height="75" rx="3" fill="#a855f7" class="bar-anim-1" />
      <rect x="100" y="-60" width="14" height="60" rx="3" fill="#ec4899" class="bar-anim-2" />
      <rect x="125" y="-85" width="14" height="85" rx="3" fill="#38bdf8" class="bar-anim-3" />
    </g>

    <!-- Mini Indicator Badge -->
    <g transform="translate(180, 105)">
      <rect width="62" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="31" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">+32.4%</text>
    </g>
  </g>

  <!-- Foreground Content: Header & Badges (Ensured completely clear & unhidden) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 65)">
      <rect width="320" height="32" rx="16" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1">CURATED ADTECH ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Large, Bold, High-Contrast Gradient) -->
    <g transform="translate(0, 140)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
        Awesome Digital Advertising Management
      </text>
    </g>

    <!-- Subtitle (Clear, Readable) -->
    <g transform="translate(0, 185)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
        Enterprise SaaS, Open-Source Ad Servers, Header Bidding &amp; Autonomous AI Ad Ops
      </text>
    </g>

    <!-- Core Feature Pills / Badges (Floating softly) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Ad Serving -->
      <g class="floating-badge">
        <rect width="160" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">🎯 Ad Serving &amp; RTB</text>
      </g>

      <!-- Pill 2: AI Ad Ops -->
      <g transform="translate(175, 0)" class="floating-badge-alt">
        <rect width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="90" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">🤖 AI Agents &amp; MCP</text>
      </g>

      <!-- Pill 3: Programmatic DSP -->
      <g transform="translate(370, 0)" class="floating-badge">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
        <text x="95" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">⚡ Programmatic &amp; Prebid</text>
      </g>

      <!-- Pill 4: Cross-Channel Bidding -->
      <g transform="translate(575, 0)" class="floating-badge-alt">
        <rect width="175" height="42" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" />
        <text x="87" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">📊 Cross-Channel ROI</text>
      </g>
    </g>

    <!-- Bottom Highlights Row -->
    <g transform="translate(0, 335)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        Transparent Pricing Limits • Real-Time Star Counters • Zero Commercial Bias • Production-Ready Stacks
      </text>
    </g>
  </g>
</svg>
